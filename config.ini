; =====================================================================
; SEDATI - Configuración del sistema de inferencia
; =====================================================================

[base_datos]
; motor = sqlite  -> usa el archivo de ruta_sqlite (se crea solo a partir de los scripts de bd/)
; motor = mysql   -> usa el servidor MySQL 8 de la sección [mysql]
;                    (antes ejecute bd/mysql/01_esquema.sql, bd/02_datos_conocimiento.sql y bd/03_datos_operacion.sql)
motor = sqlite
ruta_sqlite = bd/sedati.db

[mysql]
host = localhost
puerto = 3306
usuario = root
contrasena =
base = sedati

[motor]
; Sensibilidad del peso probabilístico al factor de certeza: P(h) ~ previa(h) * exp(beta * FC(h))
beta = 5.0
; La consulta se da por concluida cuando la hipótesis líder alcanza esta probabilidad...
umbral_probabilidad = 0.85
; ...o cuando ninguna pregunta reduce la incertidumbre al menos esta cantidad (bits)...
ganancia_minima = 0.01
; ...o cuando se alcanza este número de preguntas.
max_preguntas = 20
; Número de hipótesis que entrega el sistema.
hipotesis_resultado = 5
; Peso de una regla cuyo síntoma de entrada (condición If) no fue reportado, frente a 1.0 si sí lo fue.
aplicabilidad_base = 0.10
