; =====================================================================
; SEDATI - Configuración del sistema experto
; =====================================================================

[base_datos]
; motor = sqlite  -> usa los archivos de ruta_sqlite_kb y ruta_sqlite_trx (se crean solos a partir de bd/)
; motor = mysql   -> usa el servidor MySQL 8 de la sección [mysql]
;                    (antes ejecute:  python bd/instalar_mysql.py --host localhost --usuario root)
motor = sqlite
ruta_sqlite_kb = bd/sedati_kb.db
ruta_sqlite_trx = bd/sedati_trx.db
; Al crear la base SQLite por primera vez, carga incidentes de demostración (si | no).
datos_demostracion = si

[mysql]
host = localhost
puerto = 3306
usuario = root
contrasena =
base_kb = sedati_kb
base_trx = sedati_trx

[seguridad]
; Clave con la que se firman las sesiones. Vacía = se genera una y se guarda en bd/.secreto_sesiones.
; En AWS Lambda se define con la variable de entorno SEDATI_SECRETO.
secreto =
; Diferencia con UTC de la hora local (Colombia: -5).
utc_offset_horas = -5

[motor]
; Sensibilidad del peso probabilístico al factor de certeza: P(h) ~ previa(h) * exp(beta * FC(h))
beta = 5.0
; La consulta se da por concluida cuando la hipótesis líder alcanza esta probabilidad...
umbral_probabilidad = 0.85
; ...o cuando ninguna pregunta reduce la incertidumbre al menos esta cantidad (bits)...
ganancia_minima = 0.01
; ...o cuando se alcanza este número de preguntas.
max_preguntas = 20
; Número de hipótesis que entrega el sistema.
hipotesis_resultado = 5
; Peso de una regla cuyo síntoma de entrada (condición If) no fue reportado, frente a 1.0 si sí lo fue.
aplicabilidad_base = 0.10
